workflows:
  ios-unsigned-ipa:
    name: VoidLink Stable IPA (Metal Toolchain Fixed)
    instance_type: mac_mini_m1
    max_build_duration: 60

    triggering:
      events:
        - push

    scripts:

      # =========================
      # 1. Submodules
      # =========================
      - name: Init submodules
        script: |
          set -e
          git submodule sync --recursive
          git submodule update --init --recursive

      # =========================
      # 2. Detect project
      # =========================
      - name: Detect Xcode project
        script: |
          set -e

          PROJECT=$(find . -name "*.xcodeproj" | head -1)

          if [ -z "$PROJECT" ]; then
            echo "❌ No xcodeproj found"
            exit 1
          fi

          echo "PROJECT=$PROJECT"

      # =========================
      # 3. Show schemes
      # =========================
      - name: Show schemes
        script: |
          set -e

          PROJECT=$(find . -name "*.xcodeproj" | head -1)

          echo "=== SCHEMES ==="
          xcodebuild -list -project "$PROJECT"

      # =========================
      # 4. Install Metal Toolchain (STANDARD FIX)
      # =========================
      - name: Install Metal Toolchain
        script: |
          set -e

          echo "== Attempting to install Metal Toolchain =="

          # 官方推荐方式
          xcodebuild -downloadComponent MetalToolchain || {
            echo "⚠️ MetalToolchain download failed (CI may not support it)"
          }

          echo "== Verifying Metal compiler =="

          xcrun metal -v || {
            echo "⚠️ Metal compiler still unavailable - continuing build with fallback flags"
          }

          echo "== Setting Metal environment =="

          export METAL_DEVICE_FAMILY=1,2
          export MTL_ENABLE_DEBUG_INFO=0

      # =========================
      # 5. Build unsigned app
      # =========================
      - name: Build unsigned app
        script: |
          set -e

          PROJECT=$(find . -name "*.xcodeproj" | head -1)

          # ⚠️ 改成你 CI log 里真实 scheme
          SCHEME="VoidLink"

          echo "Using project: $PROJECT"
          echo "Using scheme: $SCHEME"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_METAL_FLAGS="-Wno-error" \
            METAL_DEVICE_FAMILY=1,2 \
            clean build

      # =========================
      # 6. Create IPA
      # =========================
      - name: Create IPA
        script: |
          set -e

          APP_PATH=$(find build -type d -name "*.app" | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "❌ .app not found"
            exit 1
          fi

          echo "Found app: $APP_PATH"

          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/

          zip -r VoidLink-unsigned.ipa Payload

    artifacts:
      - VoidLink-unsigned.ipa
      - build/**/*.dSYM