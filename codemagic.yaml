workflows:
  ios-unsigned-ipa:
    name: VoidLink Stable IPA (Metal Fixed)
    instance_type: mac_mini_m1
    max_build_duration: 60

    triggering:
      events:
        - push

    scripts:

      # =========================
      # 1. Submodule（安全初始化）
      # =========================
      - name: Init submodules
        script: |
          set -e
          git submodule sync --recursive
          git submodule update --init --recursive

      # =========================
      # 2. 找 project
      # =========================
      - name: Detect project
        script: |
          set -e
          PROJECT=$(find . -name "*.xcodeproj" | head -1)
          echo "PROJECT=$PROJECT"

          if [ -z "$PROJECT" ]; then
            echo "❌ No xcodeproj found"
            exit 1
          fi

      # =========================
      # 3. 打印 scheme（关键）
      # =========================
      - name: Show schemes
        script: |
          set -e
          PROJECT=$(find . -name "*.xcodeproj" | head -1)

          echo "=== SCHEMES ==="
          xcodebuild -list -project "$PROJECT"

      # =========================
      # 4. Metal 修复（关键新增）
      # =========================
      - name: Fix Metal compilation issues
        script: |
          echo "Applying Metal compatibility fixes..."

          export METAL_DEVICE_FAMILY=1,2
          export OTHER_METAL_FLAGS="-Wno-error"

          # 防止 Xcode 26 stricter shader validation
          defaults write com.apple.dt.Xcode MetalForceBinaryArchiveCompilation -bool NO || true

      # =========================
      # 5. Build（稳定版）
      # =========================
      - name: Build unsigned app
        script: |
          set -e

          PROJECT=$(find . -name "*.xcodeproj" | head -1)
          SCHEME="VoidLink"

          echo "PROJECT=$PROJECT"
          echo "SCHEME=$SCHEME"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_METAL_FLAGS="-Wno-error" \
            METAL_DEVICE_FAMILY=1,2 \
            clean build

      # =========================
      # 6. 打包 IPA
      # =========================
      - name: Create IPA
        script: |
          set -e

          APP_PATH=$(find build -type d -name "*.app" | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "❌ .app not found"
            exit 1
          fi

          echo "APP=$APP_PATH"

          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/

          zip -r VoidLink-unsigned.ipa Payload

    artifacts:
      - VoidLink-unsigned.ipa
      - build/**/*.dSYM